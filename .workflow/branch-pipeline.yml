# 兜行 · Gitee Go 分支流水线

version: '1.0'
name: branch-pipeline
displayName: 兜行 · 分支 CI

triggers:
  push:
    branches:
      exclude:
        - master
        - main
      include:
        - .*

stages:
  - stage: verify
    name: verify
    displayName: 快速校验
    strategy: fast
    trigger: auto
    steps:
      - step: build@nodejs
        name: branch_ci
        displayName: 共享包 + PC 校验
        nodeVersion: 20.18.0
        commands:
          - set -e
          - export DOUXING_PM=pnpm
          - npm config set registry https://registry.npmmirror.com
          - npm install -g pnpm@9.15.0
          - pnpm config set registry https://registry.npmmirror.com
          - pnpm install --frozen-lockfile
          - pnpm --filter @douxing/shared build
          - pnpm --filter @douxing/pc lint
