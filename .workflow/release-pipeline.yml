# 兜行 · Gitee Go 发版流水线（打 v* 标签后，手动触发部署阶段）
# 机密变量：DEPLOY_HOST、DEPLOY_USER、DEPLOY_SSH_KEY

version: '1.0'
name: release-pipeline
displayName: 兜行 · 生产发版

triggers:
  push:
    tags:
      prefix:
        - v

stages:
  - stage: build
    name: build
    displayName: 构建
    strategy: fast
    trigger: auto
    steps:
      - step: build@nodejs
        name: release_build
        displayName: 全量构建
        nodeVersion: 18.20.0
        commands:
          - export DOUXING_PM=pnpm
          - npm install -g pnpm@9.15.0
          - chmod +x scripts/ci-build.sh
          - bash scripts/ci-build.sh

  - stage: deploy
    name: deploy
    displayName: 远程发版
    strategy: fast
    trigger: manual
    steps:
      - step: shell@agent
        name: ssh_deploy
        displayName: SSH 部署到生产服务器
        hostGroupID: gitee-go
        script: |
          chmod +x scripts/gitee-deploy-remote.sh
          bash scripts/gitee-deploy-remote.sh
