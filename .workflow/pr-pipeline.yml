# 兜行 · Gitee Go PR 流水线

version: '1.0'
name: pr-pipeline
displayName: 兜行 · PR CI

triggers:
  pr:
    branches:
      precise:
        - master
        - main

stages:
  - stage: verify
    name: verify
    displayName: 类型检查与编译
    strategy: fast
    trigger: auto
    steps:
      - step: build@nodejs
        name: pr_ci
        displayName: 共享包 + PC 校验 + 后端
        nodeVersion: 20.18.0
        commands:
          - set -e
          - export DOUXING_PM=pnpm
          - npm config set registry https://registry.npmmirror.com
          - npm install -g pnpm@9.15.0
          - pnpm config set registry https://registry.npmmirror.com
          - pnpm install --frozen-lockfile
          - pnpm --filter @douxing/shared build
          - pnpm --filter @douxing/pc lint
          - pnpm build:server
