# 兜行 · Gitee Go 主干流水线（push master/main 自动 CI）
# 构建命令内联，避免 .sh 在 Windows 下 CRLF 导致 Linux CI 失败

version: '1.0'
name: master-pipeline
displayName: 兜行 · 主干 CI

triggers:
  push:
    branches:
      precise:
        - master
        - main

stages:
  - stage: build
    name: build
    displayName: 构建与校验
    strategy: fast
    trigger: auto
    steps:
      - step: build@nodejs
        name: ci_build
        displayName: Monorepo 构建（pnpm）
        nodeVersion: 20.18.0
        commands:
          - set -e
          - export DOUXING_PM=pnpm
          - npm config set registry https://registry.npmmirror.com
          - npm install -g pnpm@9.15.0
          - pnpm config set registry https://registry.npmmirror.com
          - pnpm install --frozen-lockfile
          - pnpm --filter @douxing/shared build
          - pnpm --filter @douxing/pc lint
          - pnpm build:server
          - pnpm build:pc
          - pnpm build:web
        artifacts:
          - name: PC_DIST
            path:
              - packages/pc/dist
          - name: WEB_DIST
            path:
              - packages/web/dist
