# 兜行 · Gitee Go 主干流水线（push master/main 自动 CI）
# 注意：Gitee 默认识别小写 master-pipeline.yml，勿与 MasterPipeline.yml 重复维护

version: '1.0'
name: master-pipeline
displayName: 兜行 · 主干 CI

triggers:
  push:
    branches:
      precise:
        - master
        - main

stages:
  - stage: build
    name: build
    displayName: 构建与校验
    strategy: fast
    trigger: auto
    steps:
      - step: build@nodejs
        name: ci_build
        displayName: Monorepo 构建（pnpm）
        nodeVersion: 18.20.0
        commands:
          - export DOUXING_PM=pnpm
          - npm install -g pnpm@9.15.0
          - chmod +x scripts/ci-build.sh
          - bash scripts/ci-build.sh
        artifacts:
          - name: PC_DIST
            path:
              - packages/pc/dist
          - name: WEB_DIST
            path:
              - packages/web/dist
