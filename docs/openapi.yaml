          type: string
          enum: [buyer, seller, provider, org]
        toUserId: { type: integer, nullable: true }
        toOrgId: { type: integer, nullable: true }
        rating: { type: integer, minimum: 1, maximum: 5 }
        content: { type: string, maxLength: 2000, nullable: true }
