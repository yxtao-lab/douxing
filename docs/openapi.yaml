                        $ref: '#/components/schemas/AnalyticsOverview'
        '403':
          description: 非管理员

  /api/analytics/trends:
    get:
      tags: [数据分析]
      summary: 按日趋势（管理员）
      operationId: analyticsTrends
      parameters:
        - name: days
          in: query
          description: 天数，1～90，默认 30
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AnalyticsDailyPoint'
        '403':
          description: 非管理员

  /api/analytics/top-cities:
    get:
      tags: [数据分析]
      summary: 打卡城市排行（管理员）
      operationId: analyticsTopCities
      parameters:
        - name: limit
          in: query
          description: Top N，1～50，默认 10
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AnalyticsCityRankItem'
        '403':
          description: 非管理员

  /api/analytics/funnel:
    get:
      tags: [数据分析]
      summary: 旅程漏斗（管理员，DT3）
      operationId: analyticsFunnel
      parameters:
        - name: days
          in: query
          description: 天数，1～90，默认 30
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AnalyticsFunnelStep'
        '403':
          description: 非管理员

  /api/analytics/geo/distribution:
    get:
      tags: [数据分析]
      summary: 地理分布与热力点（管理员，DT5）
      operationId: analyticsGeoDistribution
      parameters:
        - name: days
          in: query
          description: 天数，1～90，默认 30
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AnalyticsGeoDistribution'
        '403':
          description: 非管理员

  /api/analytics/geo/flows:
    get:
      tags: [数据分析]
      summary: 城际 OD 流动（管理员，DT5）
      operationId: analyticsGeoFlows
      parameters:
        - name: days
          in: query
          description: 天数，1～90，默认 30
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
        - name: limit
          in: query
          description: Top N，1～50，默认 20
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AnalyticsGeoFlow'
        '403':
          description: 非管理员

  /api/analytics/events:
    post:
      tags: [数据分析]
      summary: 写入埋点事件（管理员）
      operationId: analyticsTrackEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackAnalyticsEventRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ok:
                            type: boolean
                            example: true
        '403':
          description: 非管理员

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "登录后获得的 JWT，填入 Authorization: Bearer <token>"

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema:
        type: string
        enum: [zh-CN, en-US]
        default: zh-CN
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    RouteId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    AttractionId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PlaybookId:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: hangzhou-west-lake
    AlbumId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PhotoId:
      name: photoId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: 成功
        messageKey:
          type: string
          example: api.ok
        data:
          nullable: true

    PaginatedApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PaginatedResult'

    PaginatedResult:
      type: object
      properties:
        items:
          type: array
          items: {}
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        hasMore:
          type: boolean

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
        password:
          type: string
          minLength: 6
          maxLength: 64
        nickname:
          type: string
          maxLength: 50

    PhoneRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          pattern: '^1[3-9]\d{9}$'
          example: '13800138000'

    SmsLoginRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          pattern: '^1[3-9]\d{9}$'
        code:
          type: string
          minLength: 6
          maxLength: 6

    UserInfo:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        nickname: { type: string }
        avatar: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        interestTags:
          type: array
          items: { type: string }
          nullable: true
        memberLevel: { type: integer }
        status: { type: integer }
        roles:
          type: array
          items: { type: string }

    LoginResult:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/UserInfo'

    UpdateUserProfileRequest:
      type: object
      properties:
        nickname: { type: string, minLength: 1, maxLength: 64 }
        avatar: { type: string, nullable: true }
        email: { type: string, nullable: true }
        interestTags:
          type: array
          items: { type: string }

    TravelPetInfo:
      type: object
      properties:
        id: { type: integer }
        species: { type: string, enum: [fox, cat, panda] }
        nickname: { type: string }
        personality: { type: string, enum: [guide, foodie, photo, family] }
        level: { type: integer }
        exp: { type: integer }
        mood: { type: string, enum: [happy, calm, excited, sleepy] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AdoptTravelPetRequest:
      type: object
      required: [species, nickname, personality]
      properties:
        species: { type: string, enum: [fox, cat, panda] }
        nickname: { type: string, minLength: 1, maxLength: 64 }
        personality: { type: string, enum: [guide, foodie, photo, family] }

    UpdateTravelPetRequest:
      type: object
      properties:
        nickname: { type: string, minLength: 1, maxLength: 64 }
        personality: { type: string, enum: [guide, foodie, photo, family] }

    PetMemoryWallItem:
      type: object
      properties:
        id: { type: integer }
        memoryType: { type: string }
        content: { type: string }
        importance: { type: integer }
        pinned: { type: boolean }
        metadata: { type: object, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PetMemoryWallPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PetMemoryWallItem'
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }

    ConfirmPetMemoriesRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [memoryType, content]
            properties:
              memoryType: { type: string }
              content: { type: string }
              importance: { type: integer, minimum: 1, maximum: 10 }
              metadata: { type: object }

    PetAnalyzeRequest:
      type: object
      required: [scene]
      properties:
        scene: { type: string, enum: [pre_plan, post_trip, on_demand] }
        routeId: { type: integer }
        sessionId: { type: integer }

    PetAnalyzeResult:
      type: object
      properties:
        scene: { type: string }
        insight: { type: string }
        petReply: { type: string }
        suggestedActions:
          type: array
          items:
            type: object
            properties:
              kind: { type: string }
              label: { type: string }
              payload: { type: object }
        memoriesToSave:
          type: array
          items:
            type: object
            properties:
              memoryType: { type: string }
              content: { type: string }
              importance: { type: integer }
              metadata: { type: object }
        cached: { type: boolean }
        analyzedAt: { type: string, format: date-time }

    GenerateRouteRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 2
          example: 杭州三日游，喜欢自然和美食
        days:
          type: integer
          minimum: 1
          maximum: 7
        budget:
          type: string
        provider:
          type: string
          enum: [auto, deepseek, lmstudio]

    UpdateRouteDraftRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        budgetRange: { type: string, nullable: true }
        days: { type: integer }
        interestTags:
          type: array
          items: { type: string }
        routeDetail:
          type: object

    CreateCheckInRequest:
      type: object
      required: [routeId, location]
      properties:
        routeId:
          type: integer
        attractionId:
          type: integer
        cityCode:
          type: string
        cityName:
          type: string
        location:
          type: object
          required: [latitude, longitude, placeName]
          properties:
            latitude: { type: number }
            longitude: { type: number }
            address: { type: string }
            placeName: { type: string }
        targetLatitude: { type: number }
        targetLongitude: { type: number }
        gpsAccuracy: { type: number }
        photos:
          type: array
          items: { type: string, format: uri }
          maxItems: 3
        remark:
          type: string

    RoutePlaybookBody:
      type: object
      required: [id, city, scope, classicOrder, summaryZh, summaryEn]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9-]+$'
        city: { type: string }
        scope: { type: string }
        keywords:
          type: array
          items: { type: string }
        themes:
          type: array
          items: { type: string }
        classicOrder:
          type: array
          items: { type: string }
        segments:
          type: array
          items:
            type: object
        summaryZh: { type: string }
        summaryEn: { type: string }
        enabled: { type: boolean }
        sortOrder: { type: integer }

    RoutePlaybookUpdateBody:
      type: object
      properties:
        city: { type: string }
        scope: { type: string }
        keywords:
          type: array
          items: { type: string }
        themes:
          type: array
          items: { type: string }
        classicOrder:
          type: array
          items: { type: string }
        segments:
          type: array
          items:
            type: object
        summaryZh: { type: string }
        summaryEn: { type: string }
        enabled: { type: boolean }
        sortOrder: { type: integer }

    CreateJourneyAlbumRequest:
      type: object
      required: [routeId]
      properties:
        routeId:
          type: integer
          minimum: 1
        title:
          type: string
          maxLength: 128

    UserPhotoStorageInfo:
      type: object
      properties:
        level: { type: integer }
        usedBytes: { type: integer }
        maxBytes: { type: integer }
        usedCount: { type: integer }
        maxCount: { type: integer }
        maxFileBytes: { type: integer }

    UserTravelPhotoListItem:
      allOf:
        - $ref: '#/components/schemas/TravelPhotoInfo'
        - type: object
          properties:
            albumTitle: { type: string }
            routeId: { type: integer }
            routeName: { type: string, nullable: true }

    JourneyAlbumSummary:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        routeId: { type: integer }
        routeName: { type: string, nullable: true }
        title: { type: string }
        coverPhotoId: { type: integer, nullable: true }
        coverPhotoUrl: { type: string, nullable: true }
        photoCount: { type: integer }
        bytesUsed: { type: integer }
        status:
          type: string
          enum: [active, archived]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TravelPhotoInfo:
      type: object
      properties:
        id: { type: integer }
        albumId: { type: integer }
        storedUrl: { type: string }
        byteSize: { type: integer }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        dayIndex: { type: integer, nullable: true }
        poiName: { type: string, nullable: true }
        attractionId: { type: integer, nullable: true }
        checkInId: { type: integer, nullable: true }
        takenAt: { type: string, format: date-time, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        caption: { type: string, nullable: true }
        sortOrder: { type: integer }
        source:
          type: string
          enum: [upload, checkin, import]
        placementSuggestion:
          $ref: '#/components/schemas/TravelPhotoPlacementSuggestion'
        shootingParams:
          $ref: '#/components/schemas/TravelPhotoShootingParams'
        createdAt: { type: string, format: date-time }

    TravelPhotoShootingParams:
      type: object
      description: 上传时从 EXIF 解析的拍摄参数（J5+）
      properties:
        deviceMake: { type: string, nullable: true }
        deviceModel: { type: string, nullable: true }
        lensModel: { type: string, nullable: true }
        iso: { type: integer, nullable: true }
        fNumber: { type: number, nullable: true }
        exposureTimeSec: { type: number, nullable: true }
        focalLengthMm: { type: number, nullable: true }
        focalLength35mm: { type: number, nullable: true }
        flash: { type: boolean, nullable: true }
        whiteBalance: { type: string, nullable: true }

    TravelPhotoPlacementSuggestion:
      type: object
      properties:
        dayIndex: { type: integer, nullable: true }
        poiName: { type: string, nullable: true }
        attractionId: { type: integer, nullable: true }
        confidence:
          type: string
          enum: [none, low, medium, high]
        distanceM: { type: number, nullable: true }

    JourneyAlbumShareState:
      type: object
      properties:
        shareEnabled: { type: boolean }
        shareToken: { type: string, nullable: true }
        sharePath: { type: string, nullable: true }

    SharedJourneyAlbumPayload:
      type: object
      properties:
        title: { type: string }
        routeName: { type: string, nullable: true }
        photoCount: { type: integer }
        coverPhotoUrl: { type: string, nullable: true }
        photos:
          type: array
          items:
            $ref: '#/components/schemas/TravelPhotoInfo'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/JourneyAlbumPhotoGroup'

    ApplyExifSuggestionsResult:
      type: object
      properties:
        applied: { type: integer }
        skipped: { type: integer }
        photos:
          type: array
          items:
            $ref: '#/components/schemas/TravelPhotoInfo'

    JourneyAlbumPhotoGroup:
      type: object
      properties:
        dayIndex: { type: integer, nullable: true }
        poiName: { type: string, nullable: true }
        attractionId: { type: integer, nullable: true }
        photos:
          type: array
          items:
            $ref: '#/components/schemas/TravelPhotoInfo'

    JourneyAlbumDetail:
      allOf:
        - $ref: '#/components/schemas/JourneyAlbumSummary'
        - type: object
          properties:
            photos:
              type: array
              items:
                $ref: '#/components/schemas/TravelPhotoInfo'
            groups:
              type: array
              items:
                $ref: '#/components/schemas/JourneyAlbumPhotoGroup'

    UpdateTravelPhotoRequest:
      type: object
      properties:
        dayIndex: { type: integer, nullable: true }
        poiName: { type: string, nullable: true }
        attractionId: { type: integer, nullable: true }
        caption: { type: string, nullable: true }
        sortOrder: { type: integer }

    AnalyticsOverview:
      type: object
      properties:
        users:
          type: object
          properties:
            total: { type: integer }
            newToday: { type: integer }
            newLast7Days: { type: integer }
        routes:
          type: object
          properties:
            total: { type: integer }
            publicTotal: { type: integer }
            newLast7Days: { type: integer }
        orders:
          type: object
          properties:
            total: { type: integer }
            paidTotal: { type: integer }
            newLast7Days: { type: integer }
        checkins:
          type: object
          properties:
            total: { type: integer }
            approvedTotal: { type: integer }
            newLast7Days: { type: integer }
        planSessions:
          type: object
          properties:
            total: { type: integer }
            newLast7Days: { type: integer }
        generatedAt: { type: string, format: date-time }

    AnalyticsDailyPoint:
      type: object
      properties:
        date: { type: string, example: '2026-06-09' }
        users: { type: integer }
        routes: { type: integer }
        orders: { type: integer }
        checkins: { type: integer }
        planSessions: { type: integer }

    AnalyticsCityRankItem:
      type: object
      properties:
        cityCode: { type: string }
        checkinCount: { type: integer }

    AnalyticsFunnelStep:
      type: object
      properties:
        stepKey: { type: string }
        eventName: { type: string }
        count: { type: integer }
        rateFromFirst: { type: number, nullable: true }
        rateFromPrev: { type: number, nullable: true }

    AnalyticsProvinceGeoStat:
      type: object
      properties:
        provinceCode: { type: string }
        geoName: { type: string }
        adcode: { type: string }
        checkinCount: { type: integer }

    AnalyticsCityGeoStat:
      type: object
      properties:
        cityCode: { type: string }
        cityName: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        checkinCount: { type: integer }

    AnalyticsHeatPoint:
      type: object
      properties:
        latitude: { type: number }
        longitude: { type: number }
        weight: { type: number }

    AnalyticsGeoDistribution:
      type: object
      properties:
        provinces:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsProvinceGeoStat'
        cities:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsCityGeoStat'
        heatPoints:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsHeatPoint'
        scopeDays: { type: integer }
        effectiveScope:
          type: string
          enum: [window, allTime]
        generatedAt: { type: string, format: date-time }

    AnalyticsGeoFlow:
      type: object
      properties:
        fromCityCode: { type: string }
        toCityCode: { type: string }
        fromName: { type: string }
        toName: { type: string }
        fromLatitude: { type: number }
        fromLongitude: { type: number }
        toLatitude: { type: number }
        toLongitude: { type: number }
        count: { type: integer }

    TrackAnalyticsEventRequest:
      type: object
      required: [eventName]
      properties:
        eventName:
          type: string
          minLength: 1
          maxLength: 64
        eventCategory:
          type: string
          enum: [business, behavior, system]
        userId:
          type: integer
          minimum: 1
        sessionId:
          type: string
          maxLength: 64
        properties:
          type: object
          additionalProperties: true
        source:
          type: string
          enum: [server, mobile, pc, web]
        occurredAt:
          type: string
          format: date-time
