openapi: 3.0.3
info:
  title: 兜行 Douxing API
  description: |
    兜行平台 REST API（`packages/server`）。

    - 统一响应：`{ code, message, messageKey?, data }`，`code === 0` 为成功
    - 鉴权：Header `Authorization: Bearer <Access Token JWT>`；过期后客户端用 Refresh Token 调 `POST /api/auth/refresh`（见 [双Token认证与无感刷新.md](./双Token认证与无感刷新.md)）
    - 国际化：Header `Accept-Language: zh-CN | en-US`
    - 人类可读说明见 [API接口文档.md](./API接口文档.md)
  version: 1.4.1
  contact:
    name: 兜行项目

servers:
  - url: http://localhost:3000
    description: 本地开发
  - url: https://api.yxtao.site
    description: 生产环境

tags:
  - name: 系统
    description: 健康检查
  - name: 认证
    description: 注册、登录、验证码、Refresh Token 轮换与登出
  - name: 用户
    description: 资料、头像、会员
  - name: 景点
    description: 景点库与管理员维护
  - name: 路线
    description: AI 生成、列表、互动
  - name: 规划会话
    description: 多轮对话规划
  - name: 打卡
    description: 地理围栏打卡
  - name: 订单
    description: 路线解锁订单
  - name: 支付
    description: 微信支付回调
  - name: 成就
    description: 成就图鉴
  - name: 徽章
    description: 徽章图鉴
  - name: 排行榜
    description: 周榜/月榜
  - name: 语音
    description: ASR 语音识别
  - name: 分享
    description: 公开路线、小程序码
  - name: 玩法动线
    description: 管理员 Playbook CRUD
  - name: 旅程相册
    description: J1 照片存储
  - name: 数据分析
    description: 管理端指标与埋点（DT1）
  - name: 旅行宠物
    description: H3-a～c 领养、悬浮、记忆墙与分析
  - name: 管理端规划
    description: C7-W 规划诊断、沙箱运行、SSE 进度
  - name: 工作流模板
    description: C7-W W3/W5 工作流模板 CRUD 与 DAG 校验
  - name: 发单接单
    description: 模块 B marketplace M0～M7-ext — 类目、发单、撮合、商户、履约、评价、争议

security:
  - bearerAuth: []

paths:
  /:
    get:
      tags: [系统]
      summary: 根路径探测
      security: []
      operationId: getRoot
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          name: { type: string, example: 兜行 }
                          status: { type: string, example: ok }

  /api/health:
    get:
      tags: [系统]
      summary: 健康检查
      security: []
      operationId: getHealth
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          name: { type: string }
                          status: { type: string, example: ok }
                          timestamp: { type: string, format: date-time }
                          checkin: { type: object }

  /api/auth/register:
    post:
      tags: [认证]
      summary: 用户名密码注册
      security: []
      operationId: authRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResult'

  /api/auth/login:
    post:
      tags: [认证]
      summary: 用户名密码登录
      security: []
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResult'

  /api/auth/sms/send:
    post:
      tags: [认证]
      summary: 发送短信验证码
      security: []
      operationId: authSmsSend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/auth/sms/login:
    post:
      tags: [认证]
      summary: 验证码登录（未注册自动注册）
      security: []
      operationId: authSmsLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsLoginRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResult'

  /api/auth/refresh:
    post:
      tags: [认证]
      summary: 刷新 Access Token（Refresh Token 轮换）
      security: []
      operationId: authRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RefreshTokenResult'
        '401':
          description: Refresh Token 无效或已过期

  /api/auth/logout:
    post:
      tags: [认证]
      summary: 登出（吊销 Refresh Token）
      security: []
      operationId: authLogout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/auth/me:
    get:
      tags: [认证]
      summary: 当前用户（含角色）
      operationId: authMe
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserInfo'

  /api/users/me:
    get:
      tags: [用户]
      summary: 获取当前用户资料
      operationId: usersMeGet
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserInfo'
    put:
      tags: [用户]
      summary: 更新用户资料
      operationId: usersMePut
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserInfo'

  /api/users/me/membership:
    get:
      tags: [用户]
      summary: 获取会员权益信息
      operationId: usersMeMembership
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/users/me/storage:
    get:
      tags: [用户]
      summary: 获取旅行照片存储用量
      operationId: usersMeStorage
      description: J2 会员配额；已用容量/张数与上限
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserPhotoStorageInfo'

  /api/users/me/avatar:
    post:
      tags: [用户]
      summary: 上传头像
      operationId: usersMeAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 图片，≤ 2MB
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserInfo'

  /api/pets/adopt:
    post:
      tags: [旅行宠物]
      summary: 领养旅行伙伴
      operationId: petsAdopt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdoptTravelPetRequest'
      responses:
        '200':
          description: 领养成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TravelPetInfo'
        '409':
          description: 已领养
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/pets/me:
    get:
      tags: [旅行宠物]
      summary: 获取当前旅行伙伴
      operationId: petsMeGet
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TravelPetInfo'
        '404':
          description: 尚未领养
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    patch:
      tags: [旅行宠物]
      summary: 更新旅行伙伴资料
      operationId: petsMePatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTravelPetRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TravelPetInfo'

  /api/pets/me/floating-context:
    get:
      tags: [旅行宠物]
      summary: 悬浮层上下文（H3-b）
      operationId: petsMeFloatingContext
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        description: 宠物摘要、记忆召回、分析提示等 ViewModel
        '404':
          description: 尚未领养
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/pets/me/memories:
    get:
      tags: [旅行宠物]
      summary: 记忆墙分页列表
      operationId: petsMeMemoriesList
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PetMemoryWallPage'
    post:
      tags: [旅行宠物]
      summary: 确认写入建议记忆
      operationId: petsMeMemoriesConfirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPetMemoriesRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/pets/me/memories/{id}:
    patch:
      tags: [旅行宠物]
      summary: 置顶或取消置顶记忆
      operationId: petsMeMemoriesPin
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pinned]
              properties:
                pinned: { type: boolean }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    delete:
      tags: [旅行宠物]
      summary: 删除记忆
      operationId: petsMeMemoriesDelete
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/pets/me/analyze:
    post:
      tags: [旅行宠物]
      summary: 宠物 AI 分析
      operationId: petsMeAnalyze
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetAnalyzeRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PetAnalyzeResult'

  /api/attractions:
    get:
      tags: [景点]
      summary: 景点列表（已发布）
      security: []
      operationId: attractionsList
      parameters:
        - name: city
          in: query
          schema: { type: string }
        - name: cityCode
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema:
            type: string
            enum: [attraction, restaurant, hotel]
        - name: keyword
          in: query
          schema: { type: string }
        - name: tags
          in: query
          schema: { type: string }
          description: 逗号分隔标签
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/attractions/cities:
    get:
      tags: [景点]
      summary: 有景点的城市汇总
      security: []
      operationId: attractionsCities
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/attractions/{id}:
    get:
      tags: [景点]
      summary: 景点详情
      security: []
      operationId: attractionsDetail
      parameters:
        - $ref: '#/components/parameters/AttractionId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/attractions/admin/pending:
    get:
      tags: [景点]
      summary: 待审核景点（管理员）
      operationId: attractionsAdminPending
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApiResponse'

  /api/attractions/admin/catalog:
    get:
      tags: [景点]
      summary: 景点管理列表（管理员）
      operationId: attractionsAdminCatalog
      parameters:
        - name: city
          in: query
          schema: { type: string }
        - name: keyword
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApiResponse'

  /api/attractions/admin/{id}/cover:
    post:
      tags: [景点]
      summary: 上传景点封面（管理员）
      operationId: attractionsAdminCover
      parameters:
        - $ref: '#/components/parameters/AttractionId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 图片，≤ 3MB
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/attractions/admin/{id}/cover/refresh-amap:
    post:
      tags: [景点]
      summary: 高德刷新封面（管理员）
      operationId: attractionsAdminCoverRefreshAmap
      parameters:
        - $ref: '#/components/parameters/AttractionId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/attractions/admin/{id}/approve:
    post:
      tags: [景点]
      summary: 审核通过景点（管理员）
      operationId: attractionsAdminApprove
      parameters:
        - $ref: '#/components/parameters/AttractionId'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/attractions/admin/media/pending:
    get:
      tags: [景点]
      summary: 待审核路线视频列表（管理员 · H10-b）
      operationId: attractionsAdminMediaPending
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApiResponse'

  /api/attractions/admin/media/{mediaId}/review:
    patch:
      tags: [景点]
      summary: 审核路线视频（管理员 · H10-b）
      operationId: attractionsAdminMediaReview
      parameters:
        - name: mediaId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [approved, rejected]
                rejectReason:
                  type: string
                  maxLength: 256
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/routes/llm-providers:
    get:
      tags: [路线]
      summary: LLM 提供商列表
      security: []
      operationId: routesLlmProviders
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/routes/llm-status:
    get:
      tags: [路线]
      summary: LLM 可用性检测
      security: []
      operationId: routesLlmStatus
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/routes/generate:
    post:
      tags: [路线]
      summary: 单轮生成路线
      operationId: routesGenerate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRouteRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/routes:
    get:
      tags: [路线]
      summary: 路线列表
      operationId: routesList
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [mine, hot, favorites, plaza]
        - name: status
          in: query
          schema: { type: integer, enum: [0, 1, 2] }
          description: 0 草稿 / 1 已发布 / 2 归档
        - name: sort
          in: query
          schema:
            type: string
            enum: [recent, hot, views]
        - name: all
          in: query
          schema: { type: string, enum: ['1'] }
          description: 管理员查看全站
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApiResponse'

  /api/routes/plaza:
    get:
      tags: [路线]
      summary: 广场公开路线
      operationId: routesPlaza
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [recent, hot, views]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApiResponse'

  /api/routes/hot:
    get:
      tags: [路线]
      summary: 热门路线（兼容，同 plaza）
      deprecated: true
      operationId: routesHot
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApiResponse'

  /api/routes/plan-sessions:
    get:
      tags: [规划会话]
      summary: 规划会话列表
      operationId: planSessionsList
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: 成功
          content:
