# 兜行 API — Certbot 用 Nginx 配置（首次仅 HTTP）
# 域名: api.yxtao.site
# 安装: sudo bash scripts/install-nginx-certbot.sh api.yxtao.site
# 或手动:
#   sudo cp deploy/nginx/douxing-api.certbot.conf /etc/nginx/sites-available/douxing-api
#   sudo ln -sf /etc/nginx/sites-available/douxing-api /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.yxtao.site

server {
    listen 80;
    listen [::]:80;
    server_name api.yxtao.site;

    client_max_body_size 10m;

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

# Certbot 成功后会自动修改本文件，追加 443 与证书路径，并开启 HTTP→HTTPS 重定向
