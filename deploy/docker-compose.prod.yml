# 生产环境：MySQL + Redis，端口仅绑定本机（不对外暴露）
# 用法（项目根目录）：
#   docker compose -f deploy/docker-compose.prod.yml up -d
services:
  mysql:
    image: ${MYSQL_IMAGE:-docker.m.daocloud.io/library/mysql:8.0}
    container_name: douxing-mysql
    restart: always
    ports:
      - '127.0.0.1:${DOCKER_MYSQL_HOST_PORT:-3307}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-douxing}
      MYSQL_USER: ${MYSQL_USER:-douxing}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+08:00
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7-alpine}
    container_name: douxing-redis
    restart: always
    ports:
      - '127.0.0.1:${DOCKER_REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
  redis_data:
